<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El tablero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* Marcador de vestuario: barra de pestañas fija arriba, y debajo una
     sola columna que cambia entera. Verde césped sobre papel. */
  :root{
    --cesped:#1f6b3d; --cespedf:#e8f3ec;
    --fondo:#f5f4ef; --tabla:#fffefa; --tinta:#191d1a; --tenue:#5a635c;
    --raya:#dbdad0; --aviso:#8a4b14; --avisof:#fbf0e4; --rojo:#8f2f22;
    --frio:#2b5f8a; --sube:#1f6b3d; --baja:#8f2f22;
    --display:"Oswald","Arial Narrow",system-ui,sans-serif;
    --texto:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --dato:"IBM Plex Mono",ui-monospace,Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --cesped:#5fc383; --cespedf:#15301e;
      --fondo:#0e110d; --tabla:#191d17; --tinta:#eceee8; --tenue:#98a198;
      --raya:#2b312a; --aviso:#e0a160; --avisof:#2f2316; --rojo:#e88d7d;
      --frio:#79b4e0; --sube:#5fc383; --baja:#e88d7d;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --cesped:#5fc383; --cespedf:#15301e;
    --fondo:#0e110d; --tabla:#191d17; --tinta:#eceee8; --tenue:#98a198;
    --raya:#2b312a; --aviso:#e0a160; --avisof:#2f2316; --rojo:#e88d7d;
    --frio:#79b4e0; --sube:#5fc383; --baja:#e88d7d;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--fondo);color:var(--tinta);font:16px/1.55 var(--texto)}
  .hoja{max-width:62rem;margin:0 auto;
        padding-left:max(16px,env(safe-area-inset-left,0px));
        padding-right:max(16px,env(safe-area-inset-right,0px));
        padding-block:0 64px}
  button{font:inherit;color:inherit}

  /* ---- cabecera ---- */
  .alto{padding-block:22px 10px;display:flex;align-items:baseline;
        justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-family:var(--display);font-weight:600;text-transform:uppercase;
     letter-spacing:-.01em;font-size:clamp(1.7rem,7vw,2.5rem);margin:0;line-height:1}
  .sello{font-family:var(--dato);font-size:.76rem;color:var(--tenue)}

  /* ---- las pestañas ---- */
  .pestanas{position:sticky;top:0;z-index:5;background:var(--fondo);
            border-bottom:1px solid var(--raya);
            display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
            margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
            padding-inline:max(16px,env(safe-area-inset-left,0px))}
  .pestanas::-webkit-scrollbar{display:none}
  .pestanas button{flex:none;padding:12px 15px;background:none;border:0;
                   border-bottom:3px solid transparent;cursor:pointer;
                   font-family:var(--display);font-size:.92rem;font-weight:500;
                   text-transform:uppercase;letter-spacing:.06em;color:var(--tenue);
                   white-space:nowrap}
  .pestanas button:hover{color:var(--tinta)}
  .pestanas button[aria-selected=true]{color:var(--cesped);border-bottom-color:var(--cesped)}
  .pestanas .cuantos{font-family:var(--dato);font-size:.7rem;
                     background:var(--raya);border-radius:999px;padding:1px 6px;
                     margin-left:6px;color:var(--tinta)}
  .pestanas button[aria-selected=true] .cuantos{background:var(--cesped);color:var(--tabla)}

  /* ---- piezas comunes ---- */
  .caja{background:var(--tabla);border:1px solid var(--raya);border-radius:12px;
        padding:15px;margin-bottom:11px}
  .caja.valor{border-left:4px solid var(--cesped)}
  .caja.ojo{border-left:4px solid var(--aviso)}
  .eq{font-family:var(--display);font-size:1.3rem;text-transform:uppercase;
      line-height:1.1;letter-spacing:.005em}
  .li{font-size:.82rem;color:var(--tenue);margin-top:3px}
  .rl{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;
      font-family:var(--dato);font-size:.79rem;color:var(--tenue)}
  .rl b{color:var(--tinta)}

  .pista{height:9px;background:var(--fondo);border:1px solid var(--raya);
         border-radius:999px;margin-top:11px;overflow:hidden}
  .pista i{display:block;height:100%;background:var(--frio)}
  .nt{display:flex;justify-content:space-between;margin-top:5px;
      font-size:.76rem;color:var(--tenue)}

  .op{display:flex;align-items:center;gap:12px;margin-top:9px;padding:11px 12px;
      border:1px solid var(--raya);border-radius:10px;background:var(--fondo)}
  .op.top{border-color:var(--cesped);background:var(--cespedf)}
  .op .iz{flex:1;min-width:0}
  .op .q{font-weight:600}
  .op .n{font-family:var(--dato);font-size:.77rem;color:var(--tenue);margin-top:3px}
  .op .pon{font-size:.83rem;color:var(--cesped);font-weight:600;margin-top:5px}
  .op .v{font-family:var(--display);font-size:1.15rem;white-space:nowrap;
         font-variant-numeric:tabular-nums}
  .op .v.si{color:var(--cesped)}
  .op .bar{height:4px;background:var(--raya);border-radius:999px;margin-top:6px;overflow:hidden}
  .op .bar i{display:block;height:100%;background:var(--cesped)}

  h2{font-family:var(--display);font-size:.8rem;text-transform:uppercase;
     letter-spacing:.14em;color:var(--tenue);font-weight:600;margin:26px 0 10px}
  .vacia{background:var(--tabla);border:1px dashed var(--raya);border-radius:12px;
         padding:20px;color:var(--tenue)}
  .vacia b{color:var(--tinta)}

  /* ---- banco ---- */
  .banco{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
         background:var(--tabla);border:1px solid var(--raya);border-radius:12px;
         padding:11px 14px;margin:14px 0 4px}
  .banco label{font-size:.8rem;color:var(--tenue)}
  .banco input[type=number]{width:7rem;padding:7px 9px;border-radius:8px;
       border:1px solid var(--raya);background:var(--fondo);color:var(--tinta);
       font:15px var(--dato)}
  .banco .ay{font-size:.76rem;color:var(--tenue)}

  /* ---- tabla ---- */
  table{width:100%;border-collapse:collapse;background:var(--tabla);
        border:1px solid var(--raya);border-radius:12px;overflow:hidden}
  td,th{padding:9px 12px;border-top:1px solid var(--raya);font-size:.9rem;
        text-align:left}
  tr:first-child td,tr:first-child th{border-top:0}
  th{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;
     font-size:.72rem;color:var(--tenue);font-weight:600}
  td.d{font-family:var(--dato);font-size:.82rem}
  td.r{text-align:right;font-family:var(--dato);font-variant-numeric:tabular-nums}
  tr.cero td.r{color:var(--rojo);font-weight:700}

  /* ---- velas ---- */
  .selv{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .selv button{padding:7px 12px;border-radius:9px;border:1px solid var(--raya);
               background:var(--tabla);cursor:pointer;font-size:.84rem}
  .selv button[aria-pressed=true]{border-color:var(--cesped);color:var(--cesped);
                                  font-weight:600}
  .grafico{background:var(--tabla);border:1px solid var(--raya);border-radius:12px;
           padding:14px}
  .grafico svg{width:100%;height:auto;display:block}
  .leyenda{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;
           font-size:.78rem;color:var(--tenue)}
  .leyenda i{display:inline-block;width:10px;height:10px;border-radius:2px;
             margin-right:5px;vertical-align:-1px}
  .tfs{display:flex;gap:6px}
  .tfs button{padding:4px 9px;border-radius:7px;border:1px solid var(--raya);
              background:var(--fondo);font-size:.76rem;cursor:pointer}
  .tfs button[aria-pressed=true]{border-color:var(--cesped);color:var(--cesped);font-weight:700}

  .pie{margin-top:30px;padding-top:14px;border-top:1px solid var(--raya);
       font-size:.84rem;color:var(--tenue)}
  .pie b{color:var(--tinta)}
  code{font-family:var(--dato);font-size:.85em}
</style>
</head>
<body>
<div class="hoja">

  <div class="alto">
    <h1>El tablero</h1>
    <div class="sello" id="sello">cargando…</div>
  </div>

  <nav class="pestanas" id="pestanas" role="tablist"></nav>

  <div id="vista"><p class="vacia">Leyendo…</p></div>

  <div class="pie">
    <p><b>Con valor</b> es que el modelo le da más probabilidad de la que paga la casa,
      por encima del 7 %. Las cuotas vienen de la API y son de referencia:
      el precio bueno es el que veas tú en bet365.</p>
    <p id="nota"></p>
  </div>

</div>

<script>
(function () {
  'use strict';

  var EV_MIN = 0.07;
  var D = null;                       // los datos
  var VISTA = 'reco';
  var TF = 5;                         // minutos por vela
  var FOCO = null;                    // partido elegido en Velas
  var BANCO = 1000;
  var VELAS = leer('tl.velas2', {});

  function leer(k, x) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : x; } catch (e) { return x; } }
  function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  try { var b = localStorage.getItem('tl.banco'); if (b) BANCO = Number(b) || 1000; } catch (e) {}

  function esc(s) { return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function pct(x) { return Math.round((x || 0) * 100) + '%'; }
  function eur(x) { return x.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
  function hhmm(ms) { return new Date(ms).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); }
  function nombre(k) {
    if (k.side === 'exact') return 'Exactamente ' + k.line + ' córners';
    var q = k.type === 'corners' ? 'córners' : 'goles';
    return (k.side === 'over' ? 'Más' : 'Menos') + ' de ' + k.line + ' ' + q;
  }

  // Kelly a un cuarto con tope del 5 %: f = (p·cuota − 1) / (cuota − 1).
  // Entero es el máximo matemático y una ruina si te equivocas un poco en p.
  function importe(k) {
    if (!k.odd || k.p == null || k.odd <= 1) return null;
    var f = (k.p * k.odd - 1) / (k.odd - 1);
    if (!(f > 0)) return null;
    var i = BANCO * f * 0.25, tope = BANCO * 0.05;
    return { i: Math.min(i, tope), topado: i > tope };
  }

  function vivos() { return (D && D.matches) || []; }
  function analizados() {
    return vivos().filter(function (m) { return m.analyzed; })
      .sort(function (a, b) { return ((b.best && b.best.ev) || -9) - ((a.best && a.best.ev) || -9); });
  }
  function conValor() { return analizados().filter(function (m) { return m.best && m.best.ev >= EV_MIN; }); }

  // ---------- muestras para las velas ----------
  function muestrear() {
    var hay = false, ahora = Date.now();
    vivos().forEach(function (m) {
      if (!m.hasStats || m.expC == null) return;
      var s = VELAS[m.id] || (VELAS[m.id] = []);
      var u = s[s.length - 1], c = (m.cH || 0) + (m.cA || 0);
      if (u && u.m === m.min && u.c === c && Math.abs(u.e - m.expC) < 0.05) return;
      s.push({ t: ahora, m: m.min, c: c, e: m.expC });
      if (s.length > 400) s.splice(0, s.length - 400);
      hay = true;
    });
    var viejo = ahora - 20 * 3600e3;
    Object.keys(VELAS).forEach(function (k) {
      VELAS[k] = VELAS[k].filter(function (p) { return p.t > viejo; });
      if (!VELAS[k].length) { delete VELAS[k]; hay = true; }
    });
    if (hay) guardar('tl.velas2', VELAS);
  }

  function velas(fid, tf) {
    var s = VELAS[fid] || [];
    if (s.length < 2) return [];
    var por = {}, orden = [];
    s.forEach(function (p) {
      var b = Math.floor(p.m / tf) * tf;
      if (!por[b]) { por[b] = { b: b, o: p.e, h: p.e, l: p.e, c: p.e, c0: p.c, c1: p.c }; orden.push(b); }
      var v = por[b];
      v.c = p.e; v.c1 = p.c;
      if (p.e > v.h) v.h = p.e;
      if (p.e < v.l) v.l = p.e;
    });
    orden.sort(function (a, b) { return a - b; });
    var out = orden.map(function (b) { return por[b]; });
    out.forEach(function (v, i) {
      v.vol = i === 0 ? v.c1 - v.c0 : v.c1 - out[i - 1].c1;
      if (v.vol < 0) v.vol = 0;
    });
    return out;
  }

  function dibuja(vs) {
    if (vs.length < 2) return '';
    var W = 680, H = 210, HV = 46, pad = 36;
    var alto = H - HV - 12;
    var lo = Math.min.apply(null, vs.map(function (v) { return v.l; }));
    var hi = Math.max.apply(null, vs.map(function (v) { return v.h; }));
    if (hi - lo < 0.6) { var mid = (hi + lo) / 2; lo = mid - 0.3; hi = mid + 0.3; }
    var mx = Math.max.apply(null, vs.map(function (v) { return v.vol; })) || 1;
    var ancho = (W - pad - 6) / vs.length;
    var cuerpo = Math.max(3, Math.min(18, ancho * 0.6));
    var y = function (v) { return 8 + (hi - v) / (hi - lo) * (alto - 16); };

    var ejes = '';
    [hi, (hi + lo) / 2, lo].forEach(function (v) {
      ejes += '<line x1="' + pad + '" y1="' + y(v).toFixed(1) + '" x2="' + W + '" y2="' + y(v).toFixed(1)
        + '" stroke="var(--raya)" stroke-width="1"/>'
        + '<text x="0" y="' + (y(v) + 4).toFixed(1) + '" fill="var(--tenue)" font-size="11"'
        + ' font-family="IBM Plex Mono,monospace">' + v.toFixed(1) + '</text>';
    });

    var barras = vs.map(function (v, i) {
      var x = pad + i * ancho + (ancho - cuerpo) / 2, cx = x + cuerpo / 2;
      var col = v.c >= v.o ? 'var(--sube)' : 'var(--baja)';
      var yo = y(v.o), yc = y(v.c);
      var top = Math.min(yo, yc), al = Math.max(2, Math.abs(yc - yo));
      var vh = (v.vol / mx) * (HV - 8);
      return '<line x1="' + cx.toFixed(1) + '" y1="' + y(v.h).toFixed(1) + '" x2="' + cx.toFixed(1)
        + '" y2="' + y(v.l).toFixed(1) + '" stroke="' + col + '" stroke-width="1.5"/>'
        + '<rect x="' + x.toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + cuerpo.toFixed(1)
        + '" height="' + al.toFixed(1) + '" fill="' + col + '" rx="1"/>'
        + (v.vol > 0 ? '<rect x="' + x.toFixed(1) + '" y="' + (H - 14 - vh).toFixed(1)
            + '" width="' + cuerpo.toFixed(1) + '" height="' + vh.toFixed(1)
            + '" fill="var(--frio)" opacity=".55" rx="1"/>' : '')
        + '<text x="' + cx.toFixed(1) + '" y="' + (H - 2) + '" fill="var(--tenue)" font-size="9"'
        + ' text-anchor="middle" font-family="IBM Plex Mono,monospace">' + v.b + "'" + '</text>';
    }).join('');

    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img"'
      + ' aria-label="Velas de la previsión de córners">' + ejes + barras + '</svg>';
  }

  // ---------- piezas ----------
  function cabecera(m) {
    return '<div class="eq">' + esc(m.home) + ' – ' + esc(m.away) + '</div>'
      + '<div class="li">' + esc(m.league) + (m.country ? ' · ' + esc(m.country) : '') + '</div>'
      + '<div class="rl"><span>minuto <b>' + (m.min == null ? '–' : m.min) + "'</b></span>"
      + '<span>va <b>' + (m.sH == null ? '–' : m.sH + '-' + m.sA) + '</b></span>'
      + (m.hasStats ? '<span>córners <b>' + m.cH + '-' + m.cA + '</b></span>' : '')
      + (m.rH + m.rA ? '<span>rojas <b>' + m.rH + '-' + m.rA + '</b></span>' : '')
      + '</div>';
  }

  function barra(m) {
    if (!m.hasStats || !m.expC) return '';
    var van = (m.cH || 0) + (m.cA || 0), p = Math.max(0, Math.min(1, van / m.expC));
    return '<div class="pista"><i style="width:' + (p * 100).toFixed(1) + '%"></i></div>'
      + '<div class="nt"><span>van <b>' + van + '</b> córners</span>'
      + '<span>se esperan ' + m.expC.toFixed(1) + ' al final</span></div>';
  }

  function opcion(k, top) {
    var c = importe(k), ev = k.ev;
    return '<div class="op' + (top ? ' top' : '') + '"><div class="iz">'
      + '<div class="q">' + esc(nombre(k)) + '</div>'
      + '<div class="n">paga ' + (k.odd ? k.odd.toFixed(2) : '–')
      + ' · el modelo dice ' + pct(k.p) + '</div>'
      + '<div class="bar"><i style="width:' + ((k.p || 0) * 100).toFixed(1) + '%"></i></div>'
      + (c ? '<div class="pon">pon ' + eur(c.i) + (c.topado ? ' (tope)' : '')
            + ' · si entra ganas ' + eur(c.i * (k.odd - 1)) + '</div>' : '')
      + '</div><div class="v' + (ev != null && ev >= EV_MIN ? ' si' : '') + '">'
      + (ev == null ? '' : (ev >= 0 ? '+' : '') + (ev * 100).toFixed(1) + '%') + '</div></div>';
  }

  // ---------- LA FRANJA DE CORNERS ----------
  // Dos tablas distintas y las dos hacen falta.
  //
  // 1) Lo que dice el calculo, haya cuotas o no: para 3, 4, 5 y 6 numeros
  //    seguidos, cual es la mejor franja y que probabilidad tiene. De ahi
  //    sale la cuota minima que hace falta para no perder dinero a la
  //    larga: si cubres n numeros con probabilidad P, cada uno tiene que
  //    pagar al menos n/P. Por debajo de eso, aunque aciertes, pierdes.
  //
  // 2) Cuando la casa SI publica los numeros exactos, el reparto: cuanto
  //    poner en cada uno para cobrar lo mismo salga el que salga. Eso es
  //    repartir en proporcion a 1/cuota.
  function franjas(m) {
    var R = (m.exactRec || []).filter(Boolean);
    if (!R.length) return '';
    var h = '<h2>La franja, según el cálculo</h2><table><tr>'
      + '<th>Cuántos</th><th>Números</th><th class="r">Probabilidad</th>'
      + '<th class="r">Cuota mínima</th><th class="r">Con valor</th></tr>';
    R.forEach(function (w) {
      h += '<tr><td class="d">' + w.nums.length + ' números</td>'
        + '<td class="d"><b>' + w.nums.join(' · ') + '</b></td>'
        + '<td class="r">' + pct(w.P) + '</td>'
        + '<td class="r">' + w.minOdd.toFixed(2) + '</td>'
        + '<td class="r" style="color:var(--cesped)"><b>' + w.valueOdd.toFixed(2) + '</b></td></tr>';
    });
    return h + '</table><p class="li" style="margin-top:8px">La <b>cuota mínima</b> es lo '
      + 'que tiene que pagar cada número para empatar a la larga. La columna '
      + '<b>con valor</b> ya lleva el 7 % de ventaja que pedimos para entrar. Si bet365 '
      + 'paga menos que eso, no se entra aunque apetezca.</p>';
  }

  function sectores(m) {
    var e = m.exactPlan;
    if (!e || !e.nums || !e.nums.length) return franjas(m);
    var T = BANCO * 0.05;                        // lo que se juega en la franja: el tope
    var S = e.S || e.odds.reduce(function (a, o) { return a + 1 / o; }, 0);
    var cobro = T / S;                           // se cobra igual salga el que salga
    var h = franjas(m) + '<h2>La franja, con las cuotas de ahora</h2><table><tr>'
      + '<th>Córners</th><th class="r">Paga</th><th class="r">Modelo</th>'
      + '<th class="r">Pones</th><th class="r">Cobras</th></tr>';
    e.nums.forEach(function (n, i) {
      var o = e.odds[i], parte = T * (1 / o) / S;
      h += '<tr><td class="d"><b>' + n + '</b></td>'
        + '<td class="r">' + o.toFixed(2) + '</td>'
        + '<td class="r">' + pct((e.ps || [])[i]) + '</td>'
        + '<td class="r">' + eur(parte) + '</td>'
        + '<td class="r" style="color:var(--cesped)">' + eur(cobro) + '</td></tr>';
    });
    h += '<tr><td class="d"><b>Total</b></td><td class="r">–</td>'
      + '<td class="r"><b>' + pct(e.P) + '</b></td>'
      + '<td class="r"><b>' + eur(T) + '</b></td>'
      + '<td class="r" style="color:var(--cesped)"><b>' + eur(cobro) + '</b></td></tr></table>';
    h += '<p class="li" style="margin-top:8px">Se reparte en proporción a lo que paga cada '
      + 'número, así que <b>cobras lo mismo salga el que salga</b>: ' + eur(cobro)
      + ' sobre ' + eur(T) + ' puestos. El modelo da a la franja un ' + pct(e.P)
      + ' y el mercado la paga como si fuera un ' + pct(S) + ': ahí está la ventaja de '
      + '<b>' + (e.ev >= 0 ? '+' : '') + (e.ev * 100).toFixed(1) + ' %</b>.</p>';
    return h;
  }

  function bancoHTML() {
    return '<div class="banco"><label for="banco">Banco</label>'
      + '<input type="number" id="banco" min="10" step="10" value="' + BANCO + '">'
      + '<span class="ay">Kelly a un cuarto, tope del 5 %. De aquí sale cada importe.</span></div>';
  }

  // ---------- las vistas ----------
  var VISTAS = {
    reco: { t: 'Recomendaciones', n: function () { return conValor().length; }, pinta: function () {
      var L = conValor();
      if (!L.length) {
        return bancoHTML() + '<div class="vacia"><b>Ahora mismo no hay ninguna entrada con valor.</b><br>'
          + 'De los ' + vivos().length + ' partidos en juego, ' + analizados().length
          + ' se han podido analizar. Para que salga una recomendación hace falta que el modelo '
          + 'le dé más probabilidad de la que paga la casa, y por encima del 7 %.</div>';
      }
      var h = bancoHTML();
      L.forEach(function (m) {
        h += '<div class="caja valor">' + cabecera(m) + barra(m);
        (m.markets || []).slice(0, 4).forEach(function (k, i) { h += opcion(k, i === 0); });
        h += sectores(m) + '</div>';
      });
      return h;
    }},

    ahora: { t: 'Partidos ahora', n: function () { return vivos().length; }, pinta: function () {
      var ms = vivos();
      if (!ms.length) return '<div class="vacia"><b>No hay ningún partido en juego.</b></div>';
      var an = analizados(), resto = ms.filter(function (m) { return !m.analyzed; });
      var h = '';
      if (an.length) {
        h += '<h2>Analizados</h2>';
        an.forEach(function (m) {
          h += '<div class="caja' + (m.best && m.best.ev >= EV_MIN ? ' valor' : ' ojo') + '">'
            + cabecera(m) + barra(m);
          (m.markets || []).slice(0, 3).forEach(function (k, i) { h += opcion(k, false); });
          h += sectores(m) + '</div>';
        });
      }
      if (resto.length) {
        h += '<h2>Sin analizar, ' + resto.length + '</h2><table><tr><th>Partido</th>'
          + '<th>Min</th><th>Por qué no</th></tr>';
        resto.forEach(function (m) {
          h += '<tr><td>' + esc(m.home) + ' – ' + esc(m.away)
            + '<br><span class="li">' + esc(m.league) + '</span></td>'
            + '<td class="d">' + (m.min == null ? '–' : m.min + "'") + '</td>'
            + '<td class="li">' + (m.hasOdds ? 'sin estadísticas en directo' : 'sin cuota de córners') + '</td></tr>';
        });
        h += '</table>';
      }
      return h;
    }},

    vienen: { t: 'Los que vienen', n: function () { return ((D && D.upcoming) || []).length; }, pinta: function () {
      var up = (D && D.upcoming) || [];
      if (!up.length) {
        return '<div class="vacia"><b>No hay previas cargadas.</b><br>'
          + 'La previa estudia los partidos antes de empezar y gasta llamadas de la API, '
          + 'así que solo corre cuando se le pide. Si no hay nada aquí es que no se ha '
          + 'lanzado hoy, no que no haya partidos.</div>';
      }
      var h = '<table><tr><th>Partido</th><th>Hora</th><th class="r">Córners</th>'
        + '<th class="r">Goles</th></tr>';
      up.forEach(function (p) {
        h += '<tr><td>' + esc(p.home) + ' – ' + esc(p.away)
          + '<br><span class="li">' + esc(p.league_name || '') + '</span></td>'
          + '<td class="d">' + (p.kickoff_ts ? hhmm(p.kickoff_ts) : '–') + '</td>'
          + '<td class="r">' + (p.pre_corners != null ? Number(p.pre_corners).toFixed(1) : '–') + '</td>'
          + '<td class="r">' + (p.pre_goals != null ? Number(p.pre_goals).toFixed(1) : '–') + '</td></tr>';
      });
      return h + '</table>';
    }},

    velas: { t: 'Velas', n: function () { return Object.keys(VELAS).length; }, pinta: function () {
      var con = vivos().filter(function (m) { return (VELAS[m.id] || []).length; });
      if (!con.length) {
        return '<div class="vacia"><b>Todavía no hay histórico.</b><br>'
          + 'Las velas se dibujan con lo que esta página va apuntando mientras la tienes '
          + 'abierta: una lectura por minuto. Déjala abierta unos minutos y aparecen solas. '
          + 'No se inventa nada para rellenar el hueco.</div>';
      }
      if (!FOCO || !con.find(function (m) { return m.id === FOCO; })) FOCO = con[0].id;
      var m = con.find(function (x) { return x.id === FOCO; });
      var h = '<div class="selv">' + con.map(function (x) {
        return '<button data-foco="' + x.id + '" aria-pressed="' + (x.id === FOCO) + '">'
          + esc(x.home) + ' – ' + esc(x.away) + '</button>';
      }).join('') + '</div>';

      var vs = velas(FOCO, TF);
      h += '<div class="caja">' + cabecera(m) + barra(m) + '</div>';
      h += '<div class="grafico"><div class="nt" style="margin:0 0 10px">'
        + '<b style="color:var(--tinta)">Previsión de córners al final</b>'
        + '<span class="tfs">' + [3, 5, 10].map(function (t) {
            return '<button data-tf="' + t + '" aria-pressed="' + (t === TF) + '">' + t + ' min</button>';
          }).join('') + '</span></div>';
      h += vs.length >= 2 ? dibuja(vs)
        : '<p class="li">Llevo ' + (VELAS[FOCO] || []).length + ' lectura(s). Con dos tramos '
          + 'distintos aparece la primera vela.</p>';
      h += '<div class="leyenda">'
        + '<span><i style="background:var(--sube)"></i>el partido apunta a más córners</span>'
        + '<span><i style="background:var(--baja)"></i>apunta a menos</span>'
        + '<span><i style="background:var(--frio)"></i>córners caídos en el tramo</span></div>';
      return h + '</div>';
    }},

    sistema: { t: 'Sistema', n: function () { return null; }, pinta: function () {
      var c = (D && D.cupo) || {}, ps = (D && D.pasadas) || [], t = (D && D.tablas) || {};
      var h = '';
      if (c.limite_dia) {
        h += '<div class="caja"><div class="eq">Cupo de la API</div>'
          + '<div class="li">Plan ' + esc(c.plan) + ' · ' + c.limite_dia + ' llamadas al día</div>'
          + '<div class="pista"><i style="width:' + Math.min(100, c.gastadas_hoy / c.limite_dia * 100).toFixed(1)
          + '%;background:var(--cesped)"></i></div>'
          + '<div class="nt"><span>gastadas <b>' + c.gastadas_hoy + '</b></span>'
          + '<span>quedan ' + c.quedan_hoy + '</span></div></div>';
      }
      if (ps.length) {
        h += '<h2>Las últimas pasadas</h2><table><tr><th>Hora</th><th>Tardó</th>'
          + '<th>Partidos</th><th>Resultado</th></tr>';
        ps.forEach(function (p) {
          h += '<tr><td class="d">' + hhmm(p.ts) + '</td>'
            + '<td class="d">' + (p.ms == null ? '–' : (p.ms / 1000).toFixed(1) + ' s') + '</td>'
            + '<td class="d">' + (p.vivos == null ? '–' : p.vivos) + '</td>'
            + '<td class="li" style="color:' + (p.error ? 'var(--rojo)' : 'var(--cesped)') + '">'
            + (p.error ? esc(String(p.error).replace(/^API [^:]*: /, '').slice(0, 60)) : 'terminó bien')
            + '</td></tr>';
        });
        h += '</table>';
      }
      var ORD = ['matches', 'forecasts', 'checkpoints', 'casa_log', 'team_hist', 'alerts', 'demo_bets'];
      var QUE = { matches: 'partidos guardados con su resultado', forecasts: 'previsiones antes del partido',
        checkpoints: 'fotos del minuto 15, 30, 45, 60 y 75', casa_log: 'histórico de la línea: de aquí salen las velas',
        team_hist: 'histórico por equipo: de aquí aprendería', alerts: 'avisos mandados',
        demo_bets: 'apuestas del bot de prueba' };
      h += '<h2>Lo que el sistema recuerda</h2><table>';
      ORD.filter(function (k) { return k in t; }).forEach(function (k) {
        h += '<tr' + (t[k] === 0 ? ' class="cero"' : '') + '><td class="d">' + k + '</td>'
          + '<td class="r">' + t[k] + '</td><td class="li">' + QUE[k] + '</td></tr>';
      });
      return h + '</table>';
    }}
  };

  function pestanas() {
    var n = document.getElementById('pestanas');
    n.innerHTML = Object.keys(VISTAS).map(function (k) {
      var c = VISTAS[k].n();
      return '<button role="tab" data-v="' + k + '" aria-selected="' + (k === VISTA) + '">'
        + VISTAS[k].t + (c == null ? '' : '<span class="cuantos">' + c + '</span>') + '</button>';
    }).join('');
    n.querySelectorAll('[data-v]').forEach(function (b) {
      b.onclick = function () { VISTA = b.dataset.v; render(); window.scrollTo(0, 0); };
    });
  }

  function render() {
    if (!D) return;
    pestanas();
    document.getElementById('vista').innerHTML = VISTAS[VISTA].pinta();
    document.getElementById('sello').textContent = D.updated
      ? 'última pasada: ' + new Date(D.updated).toLocaleString('es-ES',
          { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })
      : 'sin pasada';
    var vac = ['casa_log', 'team_hist', 'alerts'].filter(function (k) { return (D.tablas || {})[k] === 0; });
    document.getElementById('nota').textContent = vac.length
      ? 'Las tablas ' + vac.join(', ') + ' están vacías porque con 100 llamadas al día casi '
        + 'nunca coincide un partido en un minuto de corte y con cuota de córners publicada a la vez.'
      : '';

    var inp = document.getElementById('banco');
    if (inp) inp.oninput = function () {
      var v = Number(inp.value);
      if (v > 0) { BANCO = v; try { localStorage.setItem('tl.banco', String(v)); } catch (e) {} render(); }
    };
    document.querySelectorAll('[data-foco]').forEach(function (b) {
      b.onclick = function () { FOCO = Number(b.dataset.foco); render(); };
    });
    document.querySelectorAll('[data-tf]').forEach(function (b) {
      b.onclick = function () { TF = Number(b.dataset.tf); render(); };
    });
  }

  function cargar() {
    return fetch('datos.json?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (j) { D = j; muestrear(); render(); })
      .catch(function (e) {
        document.getElementById('vista').innerHTML =
          '<div class="vacia"><b>No pude leer los datos.</b><br>' + esc(e.message) + '</div>';
      });
  }

  cargar();
  setInterval(cargar, 60000);
})();
</script>
</body>
</html>
