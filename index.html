<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>El tablero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  /* Marcador de vestuario: barra de pestañas fija arriba, y debajo una
     sola columna que cambia entera. Verde césped sobre papel. */
  :root{
    --cesped:#1f6b3d; --cespedf:#e8f3ec;
    --fondo:#f5f4ef; --tabla:#fffefa; --tinta:#191d1a; --tenue:#5a635c;
    --raya:#dbdad0; --aviso:#8a4b14; --avisof:#fbf0e4; --rojo:#8f2f22;
    --frio:#2b5f8a; --sube:#1f6b3d; --baja:#8f2f22;
    --display:"Oswald","Arial Narrow",system-ui,sans-serif;
    --texto:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --dato:"IBM Plex Mono",ui-monospace,Consolas,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --cesped:#5fc383; --cespedf:#15301e;
      --fondo:#0e110d; --tabla:#191d17; --tinta:#eceee8; --tenue:#98a198;
      --raya:#2b312a; --aviso:#e0a160; --avisof:#2f2316; --rojo:#e88d7d;
      --frio:#79b4e0; --sube:#5fc383; --baja:#e88d7d;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --cesped:#5fc383; --cespedf:#15301e;
    --fondo:#0e110d; --tabla:#191d17; --tinta:#eceee8; --tenue:#98a198;
    --raya:#2b312a; --aviso:#e0a160; --avisof:#2f2316; --rojo:#e88d7d;
    --frio:#79b4e0; --sube:#5fc383; --baja:#e88d7d;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--fondo);color:var(--tinta);font:16px/1.55 var(--texto)}
  .hoja{max-width:62rem;margin:0 auto;
        padding-left:max(16px,env(safe-area-inset-left,0px));
        padding-right:max(16px,env(safe-area-inset-right,0px));
        padding-block:0 64px}
  button{font:inherit;color:inherit}

  /* ---- cabecera ---- */
  .alto{padding-block:22px 10px;display:flex;align-items:baseline;
        justify-content:space-between;gap:12px;flex-wrap:wrap}
  h1{font-family:var(--display);font-weight:600;text-transform:uppercase;
     letter-spacing:-.01em;font-size:clamp(1.7rem,7vw,2.5rem);margin:0;line-height:1}
  .sello{font-family:var(--dato);font-size:.76rem;color:var(--tenue)}

  /* ---- las pestañas ---- */
  .pestanas{position:sticky;top:0;z-index:5;background:var(--fondo);
            border-bottom:1px solid var(--raya);
            display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;
            margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));
            padding-inline:max(16px,env(safe-area-inset-left,0px))}
  .pestanas::-webkit-scrollbar{display:none}
  .pestanas button{flex:none;padding:12px 15px;background:none;border:0;
                   border-bottom:3px solid transparent;cursor:pointer;
                   font-family:var(--display);font-size:.92rem;font-weight:500;
                   text-transform:uppercase;letter-spacing:.06em;color:var(--tenue);
                   white-space:nowrap}
  .pestanas button:hover{color:var(--tinta)}
  .pestanas button[aria-selected=true]{color:var(--cesped);border-bottom-color:var(--cesped)}
  .pestanas .cuantos{font-family:var(--dato);font-size:.7rem;
                     background:var(--raya);border-radius:999px;padding:1px 6px;
                     margin-left:6px;color:var(--tinta)}
  .pestanas button[aria-selected=true] .cuantos{background:var(--cesped);color:var(--tabla)}

  /* ---- piezas comunes ---- */
  .caja{background:var(--tabla);border:1px solid var(--raya);border-radius:12px;
        padding:15px;margin-bottom:11px}
  .caja.valor{border-left:4px solid var(--cesped)}
  .caja.ojo{border-left:4px solid var(--aviso)}
  .eq{font-family:var(--display);font-size:1.3rem;text-transform:uppercase;
      line-height:1.1;letter-spacing:.005em}
  .li{font-size:.82rem;color:var(--tenue);margin-top:3px}
  .rl{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px;
      font-family:var(--dato);font-size:.79rem;color:var(--tenue)}
  .rl b{color:var(--tinta)}

  .pista{height:9px;background:var(--fondo);border:1px solid var(--raya);
         border-radius:999px;margin-top:11px;overflow:hidden}
  .pista i{display:block;height:100%;background:var(--frio)}
  .nt{display:flex;justify-content:space-between;margin-top:5px;
      font-size:.76rem;color:var(--tenue)}

  .op{display:flex;align-items:center;gap:12px;margin-top:9px;padding:11px 12px;
      border:1px solid var(--raya);border-radius:10px;background:var(--fondo)}
  .op.top{border-color:var(--cesped);background:var(--cespedf)}
  .op .iz{flex:1;min-width:0}
  .op .q{font-weight:600}
  .op .n{font-family:var(--dato);font-size:.77rem;color:var(--tenue);margin-top:3px}
  .op .pon{font-size:.83rem;color:var(--cesped);font-weight:600;margin-top:5px}
  .op .v{font-family:var(--display);font-size:1.15rem;white-space:nowrap;
         font-variant-numeric:tabular-nums}
  .op .v.si{color:var(--cesped)}
  .op .bar{height:4px;background:var(--raya);border-radius:999px;margin-top:6px;overflow:hidden}
  .op .bar i{display:block;height:100%;background:var(--cesped)}

  h2{font-family:var(--display);font-size:.8rem;text-transform:uppercase;
     letter-spacing:.14em;color:var(--tenue);font-weight:600;margin:26px 0 10px}
  .vacia{background:var(--tabla);border:1px dashed var(--raya);border-radius:12px;
         padding:20px;color:var(--tenue)}
  .vacia b{color:var(--tinta)}

  /* ---- banco ---- */
  .banco{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
         background:var(--tabla);border:1px solid var(--raya);border-radius:12px;
         padding:11px 14px;margin:14px 0 4px}
  .banco label{font-size:.8rem;color:var(--tenue)}
  .banco input[type=number]{width:7rem;padding:7px 9px;border-radius:8px;
       border:1px solid var(--raya);background:var(--fondo);color:var(--tinta);
       font:15px var(--dato)}
  .banco .ay{font-size:.76rem;color:var(--tenue)}

  /* ---- tabla ---- */
  table{width:100%;border-collapse:collapse;background:var(--tabla);
        border:1px solid var(--raya);border-radius:12px;overflow:hidden}
  td,th{padding:9px 12px;border-top:1px solid var(--raya);font-size:.9rem;
        text-align:left}
  tr:first-child td,tr:first-child th{border-top:0}
  th{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;
     font-size:.72rem;color:var(--tenue);font-weight:600}
  td.d{font-family:var(--dato);font-size:.82rem}
  td.r{text-align:right;font-family:var(--dato);font-variant-numeric:tabular-nums}
  tr.cero td.r{color:var(--rojo);font-weight:700}

  /* ---- velas ---- */
  .selv{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .selv button{padding:7px 12px;border-radius:9px;border:1px solid var(--raya);
               background:var(--tabla);cursor:pointer;font-size:.84rem}
  .selv button[aria-pressed=true]{border-color:var(--cesped);color:var(--cesped);
                                  font-weight:600}
  .grafico{background:var(--tabla);border:1px solid var(--raya);border-radius:12px;
           padding:14px}
  .grafico svg{width:100%;height:auto;display:block}
  .leyenda{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;
           font-size:.78rem;color:var(--tenue)}
  .leyenda i{display:inline-block;width:10px;height:10px;border-radius:2px;
             margin-right:5px;vertical-align:-1px}
  .tfs{display:flex;gap:6px}
  .tfs button{padding:4px 9px;border-radius:7px;border:1px solid var(--raya);
              background:var(--fondo);font-size:.76rem;cursor:pointer}
  .tfs button[aria-pressed=true]{border-color:var(--cesped);color:var(--cesped);font-weight:700}

  .pie{margin-top:30px;padding-top:14px;border-top:1px solid var(--raya);
       font-size:.84rem;color:var(--tenue)}
  .pie b{color:var(--tinta)}

  /* ---- el latido: la barra que no se calla ---- */
  @keyframes pulso{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 8px transparent}
                   100%{box-shadow:0 0 0 0 transparent}}
  @keyframes destello{0%,100%{background:var(--tabla)}45%{background:var(--cespedf)}}
  .latido{display:flex;align-items:center;gap:7px 16px;flex-wrap:wrap;
          background:var(--tabla);border:1px solid var(--raya);border-radius:12px;
          padding:10px 14px;margin-bottom:12px;
          font-family:var(--dato);font-size:.79rem;color:var(--tenue)}
  .latido b{color:var(--tinta)}
  .latido .vive{display:inline-flex;align-items:center;gap:7px;
                font-family:var(--display);font-size:.82rem;font-weight:600;
                text-transform:uppercase;letter-spacing:.1em}
  .latido .vive .punto{width:9px;height:9px;border-radius:50%;
                       background:currentColor;animation:pulso 1.7s infinite}
  .latido .vive.verde{color:var(--cesped)}
  .latido .vive.ambar{color:var(--aviso)}
  .latido .vive.rojo{color:var(--rojo)}
  .latido .vive.rojo .punto{animation:none}
  .latido .sep{flex:1}
  .latido button{padding:5px 11px;border-radius:999px;cursor:pointer;
                 border:1px solid var(--raya);background:var(--fondo);
                 font-family:var(--display);font-size:.76rem;font-weight:600;
                 text-transform:uppercase;letter-spacing:.08em}
  .latido button[aria-pressed=true]{border-color:var(--cesped);color:var(--cesped);
                                    background:var(--cespedf)}

  /* ---- corners ---- */
  .velasel{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
  .velasel button{padding:7px 12px;border-radius:9px;border:1px solid var(--raya);
                  background:var(--tabla);cursor:pointer;font-size:.83rem;text-align:left}
  .velasel button[aria-pressed=true]{border-color:var(--cesped);color:var(--cesped);
                                     font-weight:600;background:var(--cespedf)}
  .velasel .dd{font-family:var(--dato);font-size:.74rem;color:var(--tenue);display:block}
  .velasel button[aria-pressed=true] .dd{color:var(--cesped)}
  .figs{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
  .fig{display:inline-block;padding:4px 9px;border-radius:999px;
       font-size:.78rem;border:1px solid var(--raya);background:var(--fondo)}
  .fig.mas{border-color:var(--sube);color:var(--sube)}
  .fig.menos{border-color:var(--baja);color:var(--baja)}
  .hist{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:10px}
  .hist i{flex:1;background:var(--frio);border-radius:3px 3px 0 0;min-height:2px;
          position:relative}
  .histx{display:flex;gap:3px;margin-top:5px;font-family:var(--dato);
         font-size:.68rem;color:var(--tenue);text-align:center}
  .histx span{flex:1}
  .dif{font-family:var(--display);font-size:1.05rem;white-space:nowrap;
       font-variant-numeric:tabular-nums;text-align:right}
  .dif.mas{color:var(--sube)} .dif.menos{color:var(--baja)}

  /* ---- la lista ---- */
  .filtros{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 10px}
  .filtros button{padding:6px 13px;border-radius:999px;cursor:pointer;
                  border:1px solid var(--raya);background:var(--tabla);
                  font-size:.82rem}
  .filtros button[aria-pressed=true]{border-color:var(--cesped);color:var(--cesped);
                                     background:var(--cespedf);font-weight:600}
  .lista td,.lista th{padding:8px 10px;vertical-align:middle}
  .lista .par{font-family:var(--display);font-size:.98rem;text-transform:uppercase;
              line-height:1.15;letter-spacing:.005em}
  .lista .lug{font-size:.73rem;color:var(--tenue);font-family:var(--texto);
              text-transform:none;letter-spacing:0}
  .lista tr.val td{background:var(--cespedf)}
  .lista tr.nueva td{animation:destello 1.2s ease-in-out 3}
  .lista .vent{font-family:var(--display);font-size:1.1rem;white-space:nowrap;
               font-variant-numeric:tabular-nums;text-align:right}
  .lista .vent.si{color:var(--cesped)}
  .lista .vent.no{color:var(--tenue)}
  .sello2{display:inline-block;font-family:var(--display);font-size:.65rem;
          font-weight:600;text-transform:uppercase;letter-spacing:.09em;
          border-radius:4px;padding:1px 5px;margin-right:6px;vertical-align:1px;
          background:var(--frio);color:var(--tabla)}
  .sello2.g{background:var(--raya);color:var(--tenue)}
  .sello2.f{background:var(--aviso);color:var(--tabla)}
  .casa{display:inline-block;padding:5px 10px;border-radius:8px;
        border:1px solid var(--cesped);color:var(--cesped);background:var(--tabla);
        text-decoration:none;font-family:var(--display);font-size:.74rem;
        font-weight:600;text-transform:uppercase;letter-spacing:.06em;
        white-space:nowrap}
  .casa:hover{background:var(--cespedf)}
  .casa.gris{border-color:var(--raya);color:var(--tenue)}
  .casas{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  code{font-family:var(--dato);font-size:.85em}

    /* ---------- la escalera de precios ---------- */
    .pz{margin:14px 0 20px;border:1px solid var(--raya);border-radius:6px;
        background:var(--tabla);overflow:hidden}
    .pz>header{padding:12px 14px;border-bottom:1px solid var(--raya);
        display:flex;flex-wrap:wrap;gap:4px 18px;align-items:baseline}
    .pz>header .q{font:600 15px/1.2 var(--display);letter-spacing:.02em;
        text-transform:uppercase;flex:1 1 100%}
    .pz .heroe{font:700 34px/1 var(--dato);letter-spacing:-.02em}
    .pz .heroe small{font:600 11px/1 var(--texto);letter-spacing:.08em;
        text-transform:uppercase;color:var(--tenue);display:block;margin-bottom:3px}
    .pz .cont{padding:12px 14px}
    .lad{width:100%;border-collapse:collapse;font-family:var(--dato);font-size:13px}
    .lad th{font:600 10px/1.3 var(--texto);letter-spacing:.07em;text-transform:uppercase;
        color:var(--tenue);text-align:right;padding:0 8px 6px;white-space:nowrap}
    .lad th:first-child{text-align:left}
    .lad td{padding:4px 8px;text-align:right;border-top:1px solid var(--raya);
        font-variant-numeric:tabular-nums}
    .lad td:first-child{text-align:left;font-weight:700;position:relative}
    /* La barra es la probabilidad, dibujada detras del numero. Sin eje:
       el ancho ES el dato, y asi la forma de la campana se ve de un golpe. */
    .lad .bar{position:absolute;left:0;top:2px;bottom:2px;border-radius:2px;
        background:color-mix(in srgb,var(--cesped) 20%,transparent);z-index:0}
    .lad .bar+span{position:relative;z-index:1;padding-left:4px}
    .lad tr.top td{background:var(--cespedf)}
    .lad tr.ido td{color:var(--tenue);opacity:.55}
    .lad tr.casa td{box-shadow:inset 0 0 0 2px var(--frio)}
    .lad .ok{color:var(--cesped);font-weight:700}
    .lad .no{color:var(--tenue)}
    .pz .de{font:600 10px/1.3 var(--texto);letter-spacing:.06em;text-transform:uppercase;
        color:var(--tenue);margin:14px 0 4px}

    /* La alarma arranca apagada porque el navegador no deja sonar sin que
       el dedo la encienda una vez. Eso es obligado; que el boton pase
       desapercibido, no. Apagada se ve desde la otra punta de la mesa. */
    #snd[aria-pressed="false"]{background:var(--aviso);color:#fff;
        border-color:var(--aviso);font-weight:700;letter-spacing:.03em;
        animation:avisa 1.8s ease-in-out infinite}
    @keyframes avisa{0%,100%{opacity:1}50%{opacity:.5}}
    @media (prefers-reduced-motion:reduce){#snd[aria-pressed="false"]{animation:none}}

    /* ---------- la lista corta ---------- */
    .cc{margin:12px 0 18px;border:1px solid var(--raya);border-radius:6px;
        background:var(--tabla);overflow:hidden}
    .cc>header{padding:11px 13px;border-bottom:1px solid var(--raya)}
    .cc .q{font:600 15px/1.25 var(--display);letter-spacing:.02em;text-transform:uppercase}
    .cc .sub{font-size:11px;color:var(--tenue);margin-top:2px}
    .cc .cont{padding:11px 13px}
    .sabe{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:7px}
    .sabe b{font:700 19px/1 var(--dato);margin-right:4px}
    .sabe i{font-style:normal;font:600 10px/1 var(--texto);letter-spacing:.04em;
        text-transform:uppercase;padding:4px 7px;border-radius:3px;
        background:var(--cespedf);color:var(--cesped);border:1px solid transparent}
    .sabe i.falta{background:transparent;color:var(--tenue);border-color:var(--raya);
        text-decoration:line-through;opacity:.7}
    .dat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
        gap:7px 14px;margin:11px 0 4px}
    .dat div{font-size:12px;line-height:1.35}
    .dat span{display:block;font:600 9px/1.3 var(--texto);letter-spacing:.07em;
        text-transform:uppercase;color:var(--tenue)}
    .baja{font-size:11px;color:var(--tenue);margin-top:5px;line-height:1.45}
    .baja b{color:var(--tinta)}

    /* ---------- dormido ---------- */
    .duerme{margin:14px 0;padding:16px 18px;border-radius:6px;background:var(--avisof);
        border:1px solid var(--aviso);border-left-width:5px}
    .duerme b{display:block;font:600 15px/1.3 var(--display);letter-spacing:.02em;
        text-transform:uppercase;margin-bottom:6px}
    .duerme p{margin:6px 0 0;font-size:13px;line-height:1.5}
    /* ---------- historico ---------- */
    .hi{border-top:1px solid var(--raya);padding:10px 0}
    .hi:first-of-type{border-top:0}
    .hi .l1{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
    .hi .nom{font-weight:700;flex:1 1 200px}
    .hi .n{font-family:var(--dato);font-variant-numeric:tabular-nums}
    .hi .v{font:700 10px/1 var(--texto);letter-spacing:.07em;text-transform:uppercase;
        padding:4px 8px;border-radius:3px}
    .hi .v.si{background:var(--cespedf);color:var(--cesped)}
    .hi .v.no{background:color-mix(in srgb,var(--rojo) 14%,transparent);color:var(--rojo)}
    .tr{display:flex;gap:3px;margin-top:7px;flex-wrap:wrap}
    .tr span{flex:1 1 60px;text-align:center;font-family:var(--dato);font-size:12px;
        padding:4px 2px;border-radius:3px;background:var(--cespedf);
        font-variant-numeric:tabular-nums}
    .tr span i{display:block;font-style:normal;font-family:var(--texto);font-size:9px;
        letter-spacing:.05em;color:var(--tenue)}
    .tr span.nada{background:transparent;border:1px dashed var(--raya);color:var(--tenue)}

    /* ---------- la dureza del partido ---------- */
    .dur{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-top:7px;
        font-size:12px;font-family:var(--dato);font-variant-numeric:tabular-nums}
    .dur .et{font:700 9px/1 var(--texto);letter-spacing:.08em;text-transform:uppercase;
        padding:4px 7px;border-radius:3px;background:var(--cespedf);color:var(--cesped)}
    .dur.trabado .et{background:var(--avisof);color:var(--aviso)}
    .dur.guerra .et{background:color-mix(in srgb,var(--rojo) 14%,transparent);color:var(--rojo)}
</style>
</head>
<body>
<div class="hoja">

  <div class="alto">
    <h1>El tablero</h1>
    <div class="sello" id="sello">cargando…</div>
  </div>

  <div class="latido" id="latido"></div>
  <nav class="pestanas" id="pestanas" role="tablist"></nav>

  <div id="vista"><p class="vacia">Leyendo…</p></div>

  <div class="pie">
    <p><b>Con valor</b> es que el modelo le da más probabilidad de la que paga la casa,
      por encima del 7 %. Las cuotas vienen de la API y son de referencia:
      el precio bueno es el que veas tú en bet365.</p>
    <p id="nota"></p>
  </div>

</div>

<script>
(function () {
  'use strict';

  var EV_MIN = 0.07;
  var D = null;                       // los datos
  var VISTA = 'lista';
  var FILTRO = 'todo';                // todo | corners | valor
  var SONIDO = false;
  var VISTOS = {};                    // lo que ya sono, para no repetir
  var NUEVAS = {};                    // lo que acaba de aparecer, para el destello
  var PRIMERA = true;                 // la primera carga no dispara la alarma
  var PROX = 0;                       // cuando toca la siguiente lectura
  var AC = null;                      // el aparato de sonido del navegador
  var FIRMA = '';                     // la huella de los datos ya pintados
  var FOCOV = null;                   // el partido elegido en Córners
  var TF = 5;                         // minutos por vela
  var FOCO = null;                    // partido elegido en Velas
  var BANCO = 1000;
  var VELAS = leer('tl.velas2', {});

  function leer(k, x) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : x; } catch (e) { return x; } }
  function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  try { var b = localStorage.getItem('tl.banco'); if (b) BANCO = Number(b) || 1000; } catch (e) {}

  function esc(s) { return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function pct(x) { return Math.round((x || 0) * 100) + '%'; }
  function eur(x) { return x.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; }
  function hhmm(ms) { return new Date(ms).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); }
  function nombre(k) {
    if (k.side === 'exact') return 'Exactamente ' + k.line + ' córners';
    var q = k.type === 'corners' ? 'córners' : 'goles';
    return (k.side === 'over' ? 'Más' : 'Menos') + ' de ' + k.line + ' ' + q;
  }

  // Kelly a un cuarto con tope del 5 %: f = (p·cuota − 1) / (cuota − 1).
  // Entero es el máximo matemático y una ruina si te equivocas un poco en p.
  function importe(k) {
    if (!k.odd || k.p == null || k.odd <= 1) return null;
    var f = (k.p * k.odd - 1) / (k.odd - 1);
    if (!(f > 0)) return null;
    var i = BANCO * f * 0.25, tope = BANCO * 0.05;
    return { i: Math.min(i, tope), topado: i > tope };
  }

  function vivos() { return (D && D.matches) || []; }
  function analizados() {
    return vivos().filter(function (m) { return m.analyzed; })
      .sort(function (a, b) { return ((b.best && b.best.ev) || -9) - ((a.best && a.best.ev) || -9); });
  }
  function conValor() { return analizados().filter(function (m) { return m.best && m.best.ev >= EV_MIN; }); }

  // ---------- muestras para las velas ----------
  function muestrear() {
    var hay = false, ahora = Date.now();
    vivos().forEach(function (m) {
      if (!m.hasStats || m.expC == null) return;
      var s = VELAS[m.id] || (VELAS[m.id] = []);
      var u = s[s.length - 1], c = (m.cH || 0) + (m.cA || 0);
      if (u && u.m === m.min && u.c === c && Math.abs(u.e - m.expC) < 0.05) return;
      s.push({ t: ahora, m: m.min, c: c, e: m.expC });
      if (s.length > 400) s.splice(0, s.length - 400);
      hay = true;
    });
    var viejo = ahora - 20 * 3600e3;
    Object.keys(VELAS).forEach(function (k) {
      VELAS[k] = VELAS[k].filter(function (p) { return p.t > viejo; });
      if (!VELAS[k].length) { delete VELAS[k]; hay = true; }
    });
    if (hay) guardar('tl.velas2', VELAS);
  }

  function velas(fid, tf) {
    var s = VELAS[fid] || [];
    if (s.length < 2) return [];
    var por = {}, orden = [];
    s.forEach(function (p) {
      var b = Math.floor(p.m / tf) * tf;
      if (!por[b]) { por[b] = { b: b, o: p.e, h: p.e, l: p.e, c: p.e, c0: p.c, c1: p.c }; orden.push(b); }
      var v = por[b];
      v.c = p.e; v.c1 = p.c;
      if (p.e > v.h) v.h = p.e;
      if (p.e < v.l) v.l = p.e;
    });
    orden.sort(function (a, b) { return a - b; });
    var out = orden.map(function (b) { return por[b]; });
    out.forEach(function (v, i) {
      v.vol = i === 0 ? v.c1 - v.c0 : v.c1 - out[i - 1].c1;
      if (v.vol < 0) v.vol = 0;
    });
    return out;
  }

  function dibuja(vs) {
    if (vs.length < 2) return '';
    var W = 680, H = 210, HV = 46, pad = 36;
    var alto = H - HV - 12;
    var lo = Math.min.apply(null, vs.map(function (v) { return v.l; }));
    var hi = Math.max.apply(null, vs.map(function (v) { return v.h; }));
    if (hi - lo < 0.6) { var mid = (hi + lo) / 2; lo = mid - 0.3; hi = mid + 0.3; }
    var mx = Math.max.apply(null, vs.map(function (v) { return v.vol; })) || 1;
    var ancho = (W - pad - 6) / vs.length;
    var cuerpo = Math.max(3, Math.min(18, ancho * 0.6));
    var y = function (v) { return 8 + (hi - v) / (hi - lo) * (alto - 16); };

    var ejes = '';
    [hi, (hi + lo) / 2, lo].forEach(function (v) {
      ejes += '<line x1="' + pad + '" y1="' + y(v).toFixed(1) + '" x2="' + W + '" y2="' + y(v).toFixed(1)
        + '" stroke="var(--raya)" stroke-width="1"/>'
        + '<text x="0" y="' + (y(v) + 4).toFixed(1) + '" fill="var(--tenue)" font-size="11"'
        + ' font-family="IBM Plex Mono,monospace">' + v.toFixed(1) + '</text>';
    });

    var barras = vs.map(function (v, i) {
      var x = pad + i * ancho + (ancho - cuerpo) / 2, cx = x + cuerpo / 2;
      var col = v.c >= v.o ? 'var(--sube)' : 'var(--baja)';
      var yo = y(v.o), yc = y(v.c);
      var top = Math.min(yo, yc), al = Math.max(2, Math.abs(yc - yo));
      var vh = (v.vol / mx) * (HV - 8);
      return '<line x1="' + cx.toFixed(1) + '" y1="' + y(v.h).toFixed(1) + '" x2="' + cx.toFixed(1)
        + '" y2="' + y(v.l).toFixed(1) + '" stroke="' + col + '" stroke-width="1.5"/>'
        + '<rect x="' + x.toFixed(1) + '" y="' + top.toFixed(1) + '" width="' + cuerpo.toFixed(1)
        + '" height="' + al.toFixed(1) + '" fill="' + col + '" rx="1"/>'
        + (v.vol > 0 ? '<rect x="' + x.toFixed(1) + '" y="' + (H - 14 - vh).toFixed(1)
            + '" width="' + cuerpo.toFixed(1) + '" height="' + vh.toFixed(1)
            + '" fill="var(--frio)" opacity=".55" rx="1"/>' : '')
        + '<text x="' + cx.toFixed(1) + '" y="' + (H - 2) + '" fill="var(--tenue)" font-size="9"'
        + ' text-anchor="middle" font-family="IBM Plex Mono,monospace">' + v.b + "'" + '</text>';
    }).join('');

    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img"'
      + ' aria-label="Velas de la previsión de córners">' + ejes + barras + '</svg>';
  }

  // ---------- piezas ----------
  function cabecera(m) {
    return '<div class="eq">' + esc(m.home) + ' – ' + esc(m.away) + '</div>'
      + '<div class="li">' + esc(m.league) + (m.country ? ' · ' + esc(m.country) : '') + '</div>'

      + '<span>va <b>' + (m.sH == null ? '–' : m.sH + '-' + m.sA) + '</b></span>'

  // La dureza del partido, medida y no intuida: faltas y amarillas por 90
  // minutos, que es lo unico comparable entre un partido en el 20 y otro en
  // el 80. Un partido tipo anda por 24 faltas y 4 amarillas.
  // NO entra todavia en el calculo de corners: con 15 partidos cerrados no
  // se puede saber si un partido trabado da mas corners o menos, y meterlo
  // a ojo seria inventarselo. Se ensena y se guarda; cuando haya partidos
  // suficientes se mide y entonces entra.
  function dureza(m) {
    var d = m.dureza;
    if (!d || (!d.faltas90 && !d.tarjetas90)) return '';
    var cl = d.tarjetas90 >= 7 || d.faltas90 >= 32 ? 'guerra'
           : d.tarjetas90 >= 5 || d.faltas90 >= 26 ? 'trabado' : 'normal';
    return '<div class="dur ' + cl + '">'
      + '<span><b>' + d.faltas90.toFixed(0) + '</b> faltas/90</span>'
      + '<span><b>' + d.tarjetas90.toFixed(1) + '</b> amarillas/90</span>'
      + (d.rojas ? '<span><b>' + d.rojas + '</b> roja' + (d.rojas > 1 ? 's' : '') + '</span>' : '')
      + '<span class="et">' + cl + '</span></div>';
  }

  function barra(m) {
    var h = '';
    if (m.hasStats && m.expC) {
      var van = (m.cH || 0) + (m.cA || 0), p = Math.max(0, Math.min(1, van / m.expC));
      h = '<div class="pista"><i style="width:' + (p * 100).toFixed(1) + '%"></i></div>'
        + '<div class="nt"><span>van <b>' + van + '</b> córners</span>'
        + '<span>se esperan ' + m.expC.toFixed(1) + ' al final</span></div>';
    }
    // enlaces() estaba escrita y NADIE la llamaba: por eso el enlace a la
    // casa no aparecia en ninguna pestana, ni en Recomendaciones.
    return h + dureza(m) + enlaces(m);
  }

  function opcion(k, top) {
    var c = importe(k), ev = k.ev;
    return '<div class="op' + (top ? ' top' : '') + '"><div class="iz">'
      + '<div class="q">' + esc(nombre(k)) + '</div>'
      + '<div class="n">paga ' + (k.odd ? k.odd.toFixed(2) : '–')
      + ' · el modelo dice ' + pct(k.p) + '</div>'
      + '<div class="bar"><i style="width:' + ((k.p || 0) * 100).toFixed(1) + '%"></i></div>'
      + (c ? '<div class="pon">pon ' + eur(c.i) + (c.topado ? ' (tope)' : '')
            + ' · si entra ganas ' + eur(c.i * (k.odd - 1)) + '</div>' : '')
      + '</div><div class="v' + (ev != null && ev >= EV_MIN ? ' si' : '') + '">'
      + (ev == null ? '' : (ev >= 0 ? '+' : '') + (ev * 100).toFixed(1) + '%') + '</div></div>';
  }

  // ---------- LA FRANJA DE CORNERS ----------
  // Dos tablas distintas y las dos hacen falta.
  //
  // 1) Lo que dice el calculo, haya cuotas o no: para 3, 4, 5 y 6 numeros
  //    seguidos, cual es la mejor franja y que probabilidad tiene. De ahi
  //    sale la cuota minima que hace falta para no perder dinero a la
  //    larga: si cubres n numeros con probabilidad P, cada uno tiene que
  //    pagar al menos n/P. Por debajo de eso, aunque aciertes, pierdes.
  //
  // 2) Cuando la casa SI publica los numeros exactos, el reparto: cuanto
  //    poner en cada uno para cobrar lo mismo salga el que salga. Eso es
  //    repartir en proporcion a 1/cuota.
  function franjas(m) {
    var R = (m.exactRec || []).filter(Boolean);
    // Silencio no: si no hay franja, que se vea POR QUE no la hay.
    if (!R.length) {
      return '<h2>La franja de córners</h2><div class="vacia">'
        + (m.hasStats
            ? '<b>Este partido tiene estadísticas pero el modelo no encuentra franja.</b><br>'
              + 'Pasa cuando va tan avanzado que ya casi no caben más córners.'
            : '<b>Sin franja: este partido no trae estadísticas de córners.</b><br>'
              + 'La API da el marcador y las cuotas, pero no cuántos córners llevan. '
              + 'Sin ese número el modelo no puede calcular a cuántos acabará, y sin eso '
              + 'no hay franja que jugar. Por eso aquí solo ves mercados de goles.')
        + '</div>';
    }
    var h = '<h2>La franja, según el cálculo</h2><table><tr>'
      + '<th>Cuántos</th><th>Números</th><th class="r">Probabilidad</th>'
      + '<th class="r">Cuota mínima</th><th class="r">Con valor</th></tr>';
    R.forEach(function (w) {
      h += '<tr><td class="d">' + w.nums.length + ' números</td>'
        + '<td class="d"><b>' + w.nums.join(' · ') + '</b></td>'
        + '<td class="r">' + pct(w.P) + '</td>'
        + '<td class="r">' + w.minOdd.toFixed(2) + '</td>'
        + '<td class="r" style="color:var(--cesped)"><b>' + w.valueOdd.toFixed(2) + '</b></td></tr>';
    });
    return h + '</table><p class="li" style="margin-top:8px">La <b>cuota mínima</b> es lo '
      + 'que tiene que pagar cada número para empatar a la larga. La columna '
      + '<b>con valor</b> ya lleva el 7 % de ventaja que pedimos para entrar. Si bet365 '
      + 'paga menos que eso, no se entra aunque apetezca.</p>';
  }

  function sectores(m) {
    var e = m.exactPlan;
    if (!e || !e.nums || !e.nums.length) return franjas(m);
    var T = BANCO * 0.05;                        // lo que se juega en la franja: el tope
    var S = e.S || e.odds.reduce(function (a, o) { return a + 1 / o; }, 0);
    var cobro = T / S;                           // se cobra igual salga el que salga
    var h = franjas(m) + '<h2>La franja, con las cuotas de ahora</h2><table><tr>'
      + '<th>Córners</th><th class="r">Paga</th><th class="r">Modelo</th>'
      + '<th class="r">Pones</th><th class="r">Cobras</th></tr>';
    e.nums.forEach(function (n, i) {
      var o = e.odds[i], parte = T * (1 / o) / S;
      h += '<tr><td class="d"><b>' + n + '</b></td>'
        + '<td class="r">' + o.toFixed(2) + '</td>'
        + '<td class="r">' + pct((e.ps || [])[i]) + '</td>'
        + '<td class="r">' + eur(parte) + '</td>'
        + '<td class="r" style="color:var(--cesped)">' + eur(cobro) + '</td></tr>';
    });
    h += '<tr><td class="d"><b>Total</b></td><td class="r">–</td>'
      + '<td class="r"><b>' + pct(e.P) + '</b></td>'
      + '<td class="r"><b>' + eur(T) + '</b></td>'
      + '<td class="r" style="color:var(--cesped)"><b>' + eur(cobro) + '</b></td></tr></table>';
    h += '<p class="li" style="margin-top:8px">Se reparte en proporción a lo que paga cada '
      + 'número, así que <b>cobras lo mismo salga el que salga</b>: ' + eur(cobro)
      + ' sobre ' + eur(T) + ' puestos. El modelo da a la franja un ' + pct(e.P)
      + ' y el mercado la paga como si fuera un ' + pct(S) + ': ahí está la ventaja de '
      + '<b>' + (e.ev >= 0 ? '+' : '') + (e.ev * 100).toFixed(1) + ' %</b>.</p>';
    return h;
  }

  function bancoHTML() {
    return '<div class="banco"><label for="banco">Banco</label>'
      + '<input type="number" id="banco" min="10" step="10" value="' + BANCO + '">'
      + '<span class="ay">Kelly a un cuarto, tope del 5 %. De aquí sale cada importe.</span></div>';
  }

  // ---------- las oportunidades, todas juntas y ordenadas ----------
  // Una fila por mercado de cada partido analizado, mas una fila por franja
  // de corners entera. La ventaja manda el orden: lo que mas paga de mas,
  // arriba. Nada de mirar partido por partido.
  function oportunidades() {
    var out = [];
    analizados().forEach(function (m) {
      (m.markets || []).forEach(function (k) {
        if (k.p == null || !k.odd) return;
        out.push({ m: m, k: k, p: k.p, odd: k.odd,
          ev: k.ev != null ? k.ev : k.p * k.odd - 1,
          cor: k.type === 'corners',
          id: m.id + '|' + k.type + '|' + k.side + '|' + k.line + '|' + k.odd });
      });
      var e = m.exactPlan;
      if (e && e.nums && e.nums.length) {
        out.push({ m: m, franja: e, p: e.P, odd: null, ev: e.ev, cor: true,
          id: m.id + '|franja|' + e.nums.join('-') });
      }
    });
    out.sort(function (a, b) { return (b.ev == null ? -9 : b.ev) - (a.ev == null ? -9 : a.ev); });
    return out;
  }

  function filtradas() {
    var L = oportunidades();
    if (FILTRO === 'corners') L = L.filter(function (o) { return o.cor; });
    if (FILTRO === 'valor') L = L.filter(function (o) { return o.ev >= EV_MIN; });
    return L;
  }

  // ---------- el enlace a la casa ----------
  // Enlace directo a un partido concreto no lo publica ninguna casa. Lo que
  // si existe es el directo de futbol, y el buscador para ubicarlo rapido.
  function casaURL() { return 'https://www.bet365.es/#/IP/B1'; }
  function buscaURL(m) {
    return 'https://www.flashscore.es/busqueda/?q=' + encodeURIComponent(m.home);
  }
  function enlaces(m) {
    return '<div class="casas">'
      + '<a class="casa" href="' + casaURL() + '" target="_blank" rel="noopener">Abrir bet365 en directo</a>'
      + '<a class="casa gris" href="' + buscaURL(m) + '" target="_blank" rel="noopener">Buscar el partido</a>'
      + '</div>';
  }

  // ---------- la alarma ----------

  // ---------- el precio de cada numero ----------
  // Poisson: P(X = n) y P(X >= k). Las dos de corrido, sin factoriales
  // sueltos, que con n grandes se desbordan.
  function pNum(mu, n) {
    if (n < 0) return 0;
    var t = Math.exp(-mu);
    for (var i = 1; i <= n; i++) t = t * mu / i;
    return t;
  }
  function pCola(mu, k) {
    if (k <= 0) return 1;
    var t = Math.exp(-mu), a = t;
    for (var i = 1; i < k; i++) { t = t * mu / i; a += t; }
    return Math.max(0, Math.min(1, 1 - a));
  }
  // La linea de la casa salta de 8.5 a 9.5 y se queda quieta; lo que se
  // mueve son las cuotas. Quitandoles el margen queda la probabilidad
  // limpia de pasar la linea, y de ahi se despeja por biseccion la media
  // que el mercado tiene en la cabeza. Poisson no es la verdad ultima de
  // los corners, pero es monotona en la media, y eso es lo que hace que
  // el despeje tenga UNA sola solucion.
  function mediaImpl(linea, cMas, cMenos) {
    if (!(cMas > 1) || !(cMenos > 1)) return null;
    var a = 1 / cMas, b = 1 / cMenos, p = a / (a + b), k = Math.ceil(linea);
    if (p <= 0.001 || p >= 0.999) return null;
    var lo = 0.1, hi = 30;
    for (var i = 0; i < 50; i++) {
      var m = (lo + hi) / 2;
      if (pCola(m, k) < p) lo = m; else hi = m;
    }
    return (lo + hi) / 2;
  }

  function lineasDe(m) {
    var por = {};
    (m.markets || []).forEach(function (k) {
      if (k.type !== 'corners' || !k.odd) return;
      (por[k.line] = por[k.line] || {})[k.side] = k.odd;
    });
    return Object.keys(por).map(Number).sort(function (a, b) { return a - b; })
      .map(function (L) {
        return { linea: L, mas: por[L].over || null, menos: por[L].under || null,
                 mu: mediaImpl(L, por[L].over, por[L].under) };
      });
  }

  function precio(m) {
    var LS = lineasDe(m), con = LS.filter(function (x) { return x.mu != null; });
    if (!con.length) return null;
    // Manda la linea mas pareja: la que tiene las dos cuotas mas cerca es
    // la que la casa cree de verdad, y la que menos distorsiona el despeje.
    var ref = con.slice().sort(function (a, b) {
      return Math.abs(a.mas - a.menos) - Math.abs(b.mas - b.menos);
    })[0];
    var llevan = (m.cH == null && m.cA == null) ? null : (m.cH || 0) + (m.cA || 0);
    // Lo que queda por caer. La media implicita es del TOTAL final, asi
    // que a los que ya han caido no se les vuelve a poner precio.
    var resto = llevan == null ? ref.mu : Math.max(0.05, ref.mu - llevan);
    var base = llevan == null ? 0 : llevan;
    return { lineas: LS, ref: ref, llevan: llevan, resto: resto, base: base,
             mu: ref.mu, modelo: m.expC == null ? null : m.expC };
  }

  function escalera(P) {
    var fil = [], acum = 0;
    for (var n = P.base; n <= P.base + 40; n++) {
      var p = pNum(P.resto, n - P.base);
      fil.push({ n: n, p: p });
      acum += p;
      if (acum > 0.995 && n > P.base + 2) break;
    }
    var max = fil.reduce(function (a, f) { return Math.max(a, f.p); }, 0) || 1;
    var cuotas = {};                     // lo que la casa paga, por linea
    P.lineas.forEach(function (x) { cuotas[x.linea] = x; });

    var h = '<div class="de">Cada número exacto · deducido de la media, no cotizado</div>'
      + '<table class="lad"><tr><th>Córners</th><th>Probabilidad</th>'
      + '<th>Debería pagar</th><th>Para entrar (+7%)</th></tr>';
    // Los que ya cayeron, en gris y arriba: ensenar que estan descartados
    // explica la escalera mejor que esconderlos.
    if (P.llevan) {
      h += '<tr class="ido"><td><span>0 – ' + (P.base - 1) + '</span></td>'
        + '<td colspan="3" style="text-align:left;font-family:var(--texto)">'
        + 'imposible: ya llevan ' + P.llevan + '</td></tr>';
    }
    fil.forEach(function (f) {
      var justo = f.p > 0 ? 1 / f.p : null;
      h += '<tr class="' + (f.p === max ? 'top' : '') + '">'
        + '<td><i class="bar" style="width:' + (f.p / max * 100).toFixed(1) + '%"></i>'
        + '<span>' + f.n + '</span></td>'
        + '<td>' + (f.p * 100).toFixed(1) + '%</td>'
        + '<td>' + (justo && justo < 999 ? justo.toFixed(2) : '—') + '</td>'
        + '<td class="ok">' + (justo && justo < 999 ? (justo * 1.07).toFixed(2) : '—') + '</td></tr>';
    });
    h += '</table>';

    h += '<div class="de">Más / menos de cada línea · esto sí son mercados que existen</div>'
      + '<table class="lad"><tr><th>Línea</th><th>Más: prob.</th><th>debería</th>'
      + '<th>la casa</th><th>Menos: prob.</th><th>debería</th><th>la casa</th></tr>';
    var desde = Math.max(0, Math.floor(P.mu) - 5), hasta = Math.ceil(P.mu) + 5;
    for (var L = desde + 0.5; L <= hasta; L++) {
      if (L < P.base) continue;                       // ya pasada: no es mercado

        + '<td>' + (mejorN && mejorN < 99 ? mejorN.toFixed(2) : '—') + '</td>'
        + '<td class="' + (cn ? (mejorN && cn > mejorN * 1.07 ? 'ok' : 'no') : 'no') + '">'
        + (cn ? cn.toFixed(2) : '·') + '</td></tr>';
    }
    return h + '</table>';
  }

  // ---------- dormido ----------
  // Cuanto hace que son los datos. Mas de 25 minutos y los partidos que
  // enseñabamos ya no estan donde decimos: han avanzado o han acabado.
  function edadDatos() {
    // La edad que importa es la del DATO, no la de la foto. El worker sirve
    // /foto al instante, asi que su «momento» es siempre ahora: midiendo eso
    // la pagina creeria que todo esta fresco aunque la ultima pasada fuese
    // de hace tres horas, y el aviso de dormido no saltaria nunca.
    var c = D && D.ultima_pasada ? Number(D.ultima_pasada)
          : (D && D.momento ? Date.parse(D.momento) : 0);
    return c ? Math.max(0, Math.round((Date.now() - c) / 1000)) : null;
  }
  function duerme() { var e = edadDatos(); return e == null || e > 1500; }
  // Las que dependen de que los datos esten vivos. El resto (numeros,
  // velas, historico, sistema) no miente por ser vieja.
  // Claves leidas del propio VISTAS, no de memoria: escribi
  // "recomendaciones" cuando la vista se llama "reco" y la pestana que
  // manda poner dinero se quedo sin congelar; y "prox" cuando es
  // "vienen". Un partido que "va a empezar" segun datos de hace
  // dieciseis horas ya se jugo entero.
  var VIVAS = { lista: 1, ahora: 1, precios: 1, corta: 1, reco: 1, vienen: 1 };
  function avisoDormido() {
    var e = edadDatos();
    var cuanto = e == null ? 'nunca han llegado'
      : 'son de hace ' + (e < 5400 ? Math.round(e / 60) + ' minutos'
                                   : Math.round(e / 3600) + ' horas');
    return '<div class="duerme"><b>Aquí no hay nada en vivo</b>'
      + '<p>Los datos ' + cuanto + ', así que los partidos que tenía guardados ya han '
      + 'avanzado o han terminado. <b>No te los enseño</b>: un minuto 32 de hace '
      + 'dieciséis horas no es información, es una mentira con formato.</p>'
      + '<p>Las pestañas que no dependen del momento —<b>Córners</b>, <b>Velas</b>, '
      + '<b>Histórico</b> y <b>Sistema</b>— siguen valiendo: ahí el dato viejo no miente.</p>'
      + '</div>';

  function pitido() {
    try {
      var A = window.AudioContext || window.webkitAudioContext;
      if (!A) return;
      if (!AC) AC = new A();
      if (AC.state === 'suspended') AC.resume();
      [0, 0.17, 0.34].forEach(function (t) {
        var o = AC.createOscillator(), g = AC.createGain(), t0 = AC.currentTime + t;
        o.type = 'triangle';
        o.frequency.setValueAtTime(t ? 1046 : 784, t0);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(0.22, t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.15);
        o.connect(g); g.connect(AC.destination);
        o.start(t0); o.stop(t0 + 0.16);
      });
    } catch (e) {}
  }

  function alarma() {
    var ahora = Date.now();
    var L = oportunidades().filter(function (o) { return o.ev >= EV_MIN; });
    var nuevas = L.filter(function (o) { return !VISTOS[o.id]; });
    L.forEach(function (o) { VISTOS[o.id] = ahora; });
    Object.keys(VISTOS).forEach(function (k) {
      if (ahora - VISTOS[k] > 216e5) delete VISTOS[k];     // seis horas
    });
    guardar('tl.vistos', VISTOS);

    NUEVAS = {};
    if (PRIMERA) { PRIMERA = false; return; }               // al abrir, callada
    if (!nuevas.length) return;
    nuevas.forEach(function (o) { NUEVAS[o.id] = 1; });
    if (SONIDO) pitido();
    try {
      if (window.Notification && Notification.permission === 'granted') {
        var o = nuevas[0];
        new Notification('Entrada con valor: ' + (o.ev * 100).toFixed(0) + ' %', {
          body: o.m.home + ' - ' + o.m.away + ' / ' + (o.franja
            ? 'franja de ' + o.franja.nums.join(', ') + ' corners'
            : nombre(o.k) + ' a ' + o.odd),
          tag: 'tl-' + o.id,
        });
      }
    } catch (e) {}
    document.title = '(' + nuevas.length + ') El tablero';
  }

  function bonito(k) { return k.replace(/_/g, ' '); }

  // Velas japonesas de verdad: cuerpo entre apertura y cierre, mecha
  // hasta el alto y el bajo. Verde, el mercado espera MAS corners.
  function dibujaVelas(V) {
    if (!V.length) return '';
    var ancho = 760, alto = 230, izq = 42, der = 12, arr = 10, aba = 26;
    var lo = Math.min.apply(null, V.map(function (v) { return v.b; }));
    var hi = Math.max.apply(null, V.map(function (v) { return v.h; }));
    V.forEach(function (v) { if (v.modelo != null) { lo = Math.min(lo, v.modelo); hi = Math.max(hi, v.modelo); } });
    if (hi - lo < 0.5) { var m = (hi + lo) / 2; lo = m - 0.25; hi = m + 0.25; }
    var pad = (hi - lo) * 0.12; lo -= pad; hi += pad;
    var W = ancho - izq - der, H = alto - arr - aba;
    var y = function (v) { return arr + (hi - v) / (hi - lo) * H; };
    var paso = W / V.length;
    var cw = Math.max(7, Math.min(28, paso * 0.5));

    var s = '<svg viewBox="0 0 ' + ancho + ' ' + alto + '" role="img" '
      + 'aria-label="Córners que el mercado espera, foto a foto">';
    [hi, (hi + lo) / 2, lo].forEach(function (v) {
      s += '<line x1="' + izq + '" y1="' + y(v).toFixed(1) + '" x2="' + (ancho - der)
        + '" y2="' + y(v).toFixed(1) + '" stroke="var(--raya)" stroke-width="1"/>'
        + '<text x="' + (izq - 6) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end" '
        + 'font-size="11" fill="var(--tenue)" font-family="var(--dato)">' + v.toFixed(1) + '</text>';
    });

    // la linea de tu modelo, por debajo de las velas
    var pts = V.map(function (v, i) {
      return v.modelo == null ? null : (izq + paso * (i + 0.5)).toFixed(1) + ',' + y(v.modelo).toFixed(1);
    }).filter(Boolean);
    if (pts.length >= 2) {
      s += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--frio)" '
        + 'stroke-width="2" stroke-dasharray="5 4"/>';
    }
    pts.forEach(function (p) {
      var xy = p.split(',');
      s += '<circle cx="' + xy[0] + '" cy="' + xy[1] + '" r="3" fill="var(--frio)"/>';
    });

    V.forEach(function (v, i) {
      var cx = izq + paso * (i + 0.5);
      var col = v.c > v.a ? 'var(--sube)' : v.c < v.a ? 'var(--baja)' : 'var(--tenue)';
      s += '<line x1="' + cx.toFixed(1) + '" y1="' + y(v.h).toFixed(1) + '" x2="' + cx.toFixed(1)
        + '" y2="' + y(v.b).toFixed(1) + '" stroke="' + col + '" stroke-width="2"/>';
      var y1 = y(Math.max(v.a, v.c)), y2 = y(Math.min(v.a, v.c));
      s += '<rect x="' + (cx - cw / 2).toFixed(1) + '" y="' + y1.toFixed(1) + '" width="'
        + cw.toFixed(1) + '" height="' + Math.max(2, y2 - y1).toFixed(1) + '" rx="2" fill="' + col + '">'
        + '<title>minuto ' + v.minuto + '\nabre ' + v.a + '  cierra ' + v.c
        + '\ntu modelo ' + (v.modelo == null ? '-' : v.modelo)
        + '\ncórners caídos en el tramo: ' + v.v + '</title></rect>';
      s += '<text x="' + cx.toFixed(1) + '" y="' + (alto - 8) + '" text-anchor="middle" '
        + 'font-size="11" fill="var(--tenue)" font-family="var(--dato)">' + v.minuto + "'</text>";
    });
    return s + '</svg>';
  }

      }
      var ORD = ['matches', 'forecasts', 'checkpoints', 'casa_log', 'team_hist', 'alerts', 'demo_bets'];
      var QUE = { matches: 'partidos guardados con su resultado', forecasts: 'previsiones antes del partido',
        checkpoints: 'fotos del minuto 15, 30, 45, 60 y 75', casa_log: 'histórico de la línea: de aquí salen las velas',
        team_hist: 'histórico por equipo: de aquí aprendería', alerts: 'avisos mandados',
        demo_bets: 'apuestas del bot de prueba' };
      h += '<h2>Lo que el sistema recuerda</h2><table>';
      ORD.filter(function (k) { return k in t; }).forEach(function (k) {
        h += '<tr' + (t[k] === 0 ? ' class="cero"' : '') + '><td class="d">' + k + '</td>'
          + '<td class="r">' + t[k] + '</td><td class="li">' + QUE[k] + '</td></tr>';
      });
      return h + '</table>';
    }}
  };

  function pestanas() {
    var n = document.getElementById('pestanas');
    n.innerHTML = Object.keys(VISTAS).map(function (k) {
      var c = VISTAS[k].n();
      return '<button role="tab" data-v="' + k + '" aria-selected="' + (k === VISTA) + '">'
        + VISTAS[k].t + (c == null ? '' : '<span class="cuantos">' + c + '</span>') + '</button>';
    }).join('');
    n.querySelectorAll('[data-v]').forEach(function (b) {
      b.onclick = function () { VISTA = b.dataset.v; render(); window.scrollTo(0, 0); };
    });
  }

  function render() {
    if (!D) return;
    pestanas();
    // Si los datos duermen, las pestañas que viven del momento no pintan
    // partidos viejos como si estuvieran jugandose.
    document.getElementById('vista').innerHTML =
      (duerme() && VIVAS[VISTA]) ? avisoDormido() : VISTAS[VISTA].pinta();
    // DOS COSAS DISTINTAS, Y ANTES SE DECIAN IGUAL.
    // D.updated es la hora del ultimo partido EN VIVO que se vio; es null
    // cuando no hay ninguno, y entonces la pagina ponia «sin pasada», que
    // es falso: la pasada se hizo, lo que no habia era futbol. En semana de
    // selecciones eso saldria toda la semana diciendo una mentira.
    var sello = function (ms, que) {
      return que + ': ' + new Date(Number(ms)).toLocaleString('es-ES',
        { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
    };
    document.getElementById('sello').textContent =
      D.updated ? sello(D.updated, 'última pasada')
      : D.ultima_pasada ? sello(D.ultima_pasada, 'mirado') + ' · ningún partido en vivo'
      : 'todavía no se ha mirado nada';
    var vac = ['casa_log', 'team_hist', 'alerts'].filter(function (k) { return (D.tablas || {})[k] === 0; });
    document.getElementById('nota').textContent = vac.length
      ? 'Las tablas ' + vac.join(', ') + ' están vacías porque con 100 llamadas al día casi '
        + 'nunca coincide un partido en un minuto de corte y con cuota de córners publicada a la vez.'
      : '';

    var inp = document.getElementById('banco');
    if (inp) inp.oninput = function () {
      var v = Number(inp.value);
      if (v > 0) { BANCO = v; try { localStorage.setItem('tl.banco', String(v)); } catch (e) {} render(); }
    };
    document.querySelectorAll('[data-focov]').forEach(function (b) {
      b.onclick = function () { FOCOV = Number(b.dataset.focov); render(); };
    });
    document.querySelectorAll('[data-filtro]').forEach(function (b) {
      b.onclick = function () { FILTRO = b.dataset.filtro; render(); };
    });
    document.querySelectorAll('[data-foco]').forEach(function (b) {
      b.onclick = function () { FOCO = Number(b.dataset.foco); render(); };
    });
    document.querySelectorAll('[data-tf]').forEach(function (b) {
      b.onclick = function () { TF = Number(b.dataset.tf); render(); };
    });
  }

  // DE DONDE SALEN LOS DATOS, Y EN QUE ORDEN
  // 1) el worker, en /foto: la hora de verdad. Solo lee su base de datos,
  //    no gasta ni una llamada a la API, y no lleva clave porque esta
  //    pagina es publica: una clave aqui la veria cualquiera.
  // 2) datos.json, lo ultimo que publico el recolector, si el worker no
  //    contesta. Asi la pagina sigue ensenando algo y diciendo de cuando es.
  //
  // GitHub ya no esta en el camino porque no entregaba: el 9 y el 10 de
  // noviembre tocaban mas de cien pasadas programadas y salio UNA, a las
  // 00:18. Se queda como respaldo, que para eso si vale.
  var FOTO = 'https://tiros-libre.alpendre.workers.dev/foto';
  function cargar() {
    // 10 s. /foto se cachea 5 s en el borde de Cloudflare, asi que pedirla
    // a este ritmo casi nunca ejecuta el worker. Que la pagina vaya a 10 s
    // no significa que el dato sea de hace 10 s: con el plan gratis el
    // worker mira cada 45 minutos.
    PROX = Date.now() + 10000;
    return fetch(FOTO + '?t=' + Date.now())
      .then(function (r) {
        if (!r.ok) throw new Error('http ' + r.status);
        return r.json();
      })
      .catch(function () {
        return fetch('datos.json?t=' + Date.now()).then(function (r) { return r.json(); });
      })
      // Releer no es repintar. Si el fichero no ha cambiado, tocar la pagina
      // solo serviria para arrancarte el boton de debajo del dedo.
      .then(function (j) {
        var firma = JSON.stringify([j.momento, j.updated]);
        D = j; muestrear();
        if (firma !== FIRMA) { FIRMA = firma; alarma(); render(); }
        latido();
      })
      .catch(function (e) {
        document.getElementById('vista').innerHTML =
          '<div class="vacia"><b>No pude leer los datos.</b><br>' + esc(e.message) + '</div>';
      });
  }

  function tic() {
    latido();
    if (Date.now() >= PROX) cargar();
  }

  SONIDO = leer('tl.sonido', false);
  VISTOS = leer('tl.vistos', {});
  cargar();
  setInterval(tic, 1000);
})();
</script>
</body>
